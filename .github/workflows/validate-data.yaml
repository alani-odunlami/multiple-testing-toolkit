name: Validate Data

on:
  push:
  pull_request:

jobs:
  validate-data:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    
    # 🌟 FIX 1: Set default working directory for the ENTIRE job
    defaults:
      run:
        working-directory: ./script/validate-data

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # 🌟 FIX 2: Point directly to the lock file relative to the repo root
          cache-dependency-path: ./script/validate-data/package-lock.json

      - name: Validate workflows
        run: |
          npm ci
          npx ts-node-script ./index.ts
